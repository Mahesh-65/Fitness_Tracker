trigger:
  batch: true
  branches:
    include:
      - master
 
pool:
  vmImage: 'ubuntu-latest'
 
variables:
  imageRepository: 'fitness'
  imageTag: '$(Build.BuildId)'
 
steps:
 
# Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '20.x'
 
# Install dependencies
- script: |
    npm install
  displayName: 'Install Dependencies'
 
# Build and Push Docker Image
- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    command: 'buildAndPush'
    repository: '$(imageRepository)'
    dockerfile: '**/Dockerfile'
    containerRegistry: 'acrconnection'
    tags: |
      $(imageTag)
      latest
 
# Deploy to AKS
- task: KubernetesManifest@1
  displayName: 'Deploy to AKS'
  inputs:
    action: 'deploy'
    kubernetesServiceConnection: 'aksconnection'
    namespace: 'mahesh-ns'
    manifests: |
      k8s/app-deployment.yaml
      k8s/configmap.yaml
      k8s/mongodb-deployment.yaml
    containers: |
      organistationacr.azurecr.io/$(imageRepository):$(imageTag)
 
# Slack Notification
- task: Bash@3
  displayName: 'Slack Notification'
  condition: always()
  inputs:
    targetType: 'inline'
    script: |
      if [ "$(Agent.JobStatus)" = "Succeeded" ]; then
        MESSAGE="✅ Pipeline SUCCESS | Project: $(System.TeamProject) | Repo: $(Build.Repository.Name) | Branch: $(Build.SourceBranchName) | Build: $(Build.BuildNumber)"
      else
        MESSAGE="❌ Pipeline FAILED | Project: $(System.TeamProject) | Repo: $(Build.Repository.Name) | Branch: $(Build.SourceBranchName) | Build: $(Build.BuildNumber)"
      fi
 
      curl -X POST \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"$MESSAGE\"}" \
        "$SLACK_WEBHOOK_URL"
  env:
    SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)